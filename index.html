<!doctype html>
<html lang="ru" data-theme="neon">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#060811" />
  <meta name="description" content="Артур, ты справился! Ты молодец! Я люблю тебя!" />
  <title>Артур, ты справился!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="grid"></div>
  <div class="scanlines"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <main class="scene">
    <nav class="theme-switcher" aria-label="Выбор оформления">
      <button class="theme-btn" data-theme="soft" type="button">Мягкий</button>
      <button class="theme-btn active" data-theme="neon" type="button">NEON MAX</button>
    </nav>

    <section class="message-card" aria-labelledby="main-message">
      <div class="eyebrow">MISSION COMPLETE</div>

      <h1 id="main-message" class="message">
        <span>Артур, ты справился!</span>
        <span>Ты молодец!</span>
        <span class="love">Я люблю тебя!</span>
      </h1>

      <div class="pulse-line" aria-hidden="true">
        <span></span>
        <i>♥</i>
        <span></span>
      </div>

      <p class="signature">Твой папа</p>
    </section>

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
